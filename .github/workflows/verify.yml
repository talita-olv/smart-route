name: Verify SmartRoute
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  issues: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Pull Request references an existing Issue
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check_pr_issue.mjs
      - name: Test JS, routes and PR policy
        run: node --test tests/*.test.mjs
      - name: Build standalone HTML
        run: node scripts/build_standalone.mjs
