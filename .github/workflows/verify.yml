name: Verify SmartRoute
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test JS and routing rules
        run: node --test tests/*.test.mjs
      - name: Build standalone HTML
        run: node scripts/build_standalone.mjs
